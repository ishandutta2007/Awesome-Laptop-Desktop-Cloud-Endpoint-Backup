<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
    <filter id="badge-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>

    <style>
      /* Dynamic Background Animations */
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.6; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(0.95); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .p1 { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
      .p3 { animation: floatParticle 7s ease-in-out infinite 3s; }
      .p4 { animation: floatParticle 9s ease-in-out infinite 2s; }
      
      .glow-orb { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .data-wire { stroke-dasharray: 6, 6; animation: dashFlow 2s linear infinite; }
      
      .card-1 { animation: floatCard1 5s ease-in-out infinite; }
      .card-2 { animation: floatCard2 6s ease-in-out infinite 1s; }
      .card-3 { animation: floatCard3 5.5s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Ambient Glowing Blobs in Background -->
  <g class="glow-orb" filter="url(#blur-glow)">
    <circle cx="200" cy="90" r="130" fill="#0284c7" opacity="0.25"/>
    <circle cx="1000" cy="260" r="140" fill="#7c3aed" opacity="0.25"/>
    <circle cx="650" cy="40" r="90" fill="#38bdf8" opacity="0.15"/>
  </g>

  <!-- Cyber Grid Lines (Perspective & Technical Feel) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Animated Data Connection Lines (Behind Cards) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 80,180 C 250,90 400,280 600,180 S 900,90 1120,180" class="data-wire"/>
    <path d="M 120,290 C 320,330 500,70 750,220 S 980,310 1100,100" stroke="#818cf8" stroke-width="1.2" class="data-wire" style="animation-duration: 3s;"/>
  </g>

  <!-- Floating Particles in Background -->
  <g fill="#38bdf8">
    <circle cx="160" cy="90" r="2.5" class="p1"/>
    <circle cx="340" cy="270" r="3" class="p2" fill="#818cf8"/>
    <circle cx="820" cy="80" r="2" class="p3"/>
    <circle cx="1060" cy="210" r="3.5" class="p4" fill="#c084fc"/>
    <circle cx="940" cy="310" r="2.5" class="p1" fill="#38bdf8"/>
    <circle cx="510" cy="50" r="2" class="p3"/>
  </g>

  <!-- Dynamic Decorative Badge Cards (Positioned so they never overlap typography) -->
  <g transform="translate(930, 45)" class="card-1">
    <rect width="210" height="62" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#badge-glow)" fill-opacity="0.85"/>
    <circle cx="32" cy="31" r="14" fill="#0284c7" fill-opacity="0.2"/>
    <path d="M26 31 L30 35 L38 27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="56" y="27" fill="#f8fafc" font-size="12" font-weight="700">Enterprise BaaS</text>
    <text x="56" y="44" fill="#94a3b8" font-size="10.5">SaaS &amp; Cloud Endpoint</text>
  </g>

  <g transform="translate(960, 135)" class="card-2">
    <rect width="200" height="62" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#badge-glow)" fill-opacity="0.85"/>
    <circle cx="32" cy="31" r="14" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 28 31 A 4 4 0 0 1 36 31 A 4 4 0 0 1 28 31" fill="#10b981"/>
    <text x="56" y="27" fill="#f8fafc" font-size="12" font-weight="700">Open-Source FOSS</text>
    <text x="56" y="44" fill="#94a3b8" font-size="10.5">Rclone • Restic • Kopia</text>
  </g>

  <g transform="translate(920, 225)" class="card-3">
    <rect width="220" height="62" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#badge-glow)" fill-opacity="0.85"/>
    <circle cx="32" cy="31" r="14" fill="#a855f7" fill-opacity="0.2"/>
    <path d="M26 31 L32 25 L38 31 L32 37 Z" stroke="#c084fc" stroke-width="1.8" fill="none"/>
    <text x="56" y="27" fill="#f8fafc" font-size="12" font-weight="700">Immutable &amp; E2EE</text>
    <text x="56" y="44" fill="#94a3b8" font-size="10.5">Ransomware Resilient</text>
  </g>

  <!-- FOREGROUND: Content & Typography (Guaranteed Unhidden & Clear) -->
  <g transform="translate(90, 75)">
    <!-- Top Pill Badge -->
    <g>
      <rect width="265" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="14" cy="14" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="27" y="18" fill="#e0f2fe" font-size="11.5" font-weight="600" letter-spacing="0.5">CURATED AWESOME ARCHIVE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#text-grad)" font-size="38" font-weight="800" letter-spacing="-0.5">
      Laptop, Desktop &amp; Cloud
    </text>
    <text x="0" y="125" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
      Endpoint Backup Systems
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" fill="#94a3b8" font-size="15" font-weight="400">
      The authoritative index of Enterprise SaaS &amp; Open-Source backup solutions
    </text>
    <text x="0" y="187" fill="#64748b" font-size="13" font-weight="400">
      Windows • macOS • Linux • Bare-Metal Image • Client-Side Encryption • BaaS
    </text>

    <!-- Feature Quick Highlights Pills -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" fill="#38bdf8" font-size="11" font-weight="600">🛡️ Immutability</text>

      <rect x="115" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="127" y="17" fill="#818cf8" font-size="11" font-weight="600">⚡ Deduplication</text>

      <rect x="255" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="267" y="17" fill="#34d399" font-size="11" font-weight="600">💻 Multi-Platform</text>

      <rect x="390" y="0" width="115" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="402" y="17" fill="#f472b6" font-size="11" font-weight="600">☁️ Cloud BaaS</text>
    </g>
  </g>
</svg>